<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0ea5e9" />
        <title>Offline — RoutePilot</title>
        <style>
            * {
                margin: 0;
                box-sizing: border-box;
            }
            body {
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.5rem;
                padding: 2rem;
                text-align: center;
                color: #e2e8f0;
                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #0369a1 75%, #0ea5e9 100%);
            }
            img {
                width: 88px;
                height: 88px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            }
            h1 {
                font-size: 1.5rem;
                font-weight: 700;
            }
            p {
                max-width: 22rem;
                color: #cbd5e1;
                line-height: 1.5;
            }
            button {
                margin-top: 0.5rem;
                padding: 0.65rem 1.4rem;
                font-size: 1rem;
                font-weight: 600;
                color: #0f172a;
                background: #fff;
                border: 0;
                border-radius: 0.6rem;
                cursor: pointer;
            }
            button:active {
                transform: scale(0.98);
            }
        </style>
    </head>
    <body>
        <img src="/assets/images/pwa/icon-512.png" alt="RoutePilot" />
        <h1>You're offline</h1>
        <p>RoutePilot can't reach the network right now. Pages and routes you've already opened are still available — reconnect to sync the latest.</p>
        <button onclick="location.reload()">Try again</button>
    </body>
</html>
