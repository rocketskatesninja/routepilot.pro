<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.45" stop-color="#1e3a5f"/>
      <stop offset="0.8" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Navigation arrow (pilot/route mark), within the maskable safe zone. -->
  <g transform="translate(256 256) scale(8.7) translate(-12 -12)"
     fill="#ffffff" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="3 11 22 2 13 21 11 13 3 11"/>
  </g>
  <!-- Orange accent on the arrow tail, echoing the RoutePilot wordmark. -->
  <g transform="translate(256 256) scale(8.7) translate(-12 -12)"
     fill="none" stroke="#f97316" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="11 13 3 11"/>
  </g>
</svg>
