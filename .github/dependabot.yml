# Version updates, monthly, so they arrive as routine work instead of piling up unseen:
# - Minor and patch updates come as ONE pull request per ecosystem (php / js / actions),
#   to take through staging as a batch.
# - Major upgrades (Laravel 12 → 13 and the like) come as their own pull request each,
#   so they're easy to spot and plan one at a time; never merge one as part of a batch.
# Security advisories don't wait for this schedule: CI's composer/npm audits go red on the
# next push.
version: 2
updates:
  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: monthly
    groups:
      php-minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    groups:
      js-minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        update-types: ['minor', 'patch']
